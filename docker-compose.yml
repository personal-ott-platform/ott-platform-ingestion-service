services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ingestion-backend
    ports:
      - "8000:8000"
    environment:
      - RABBITMQ_URL=amqp://rabbitmqadmin:rabbitmqadmin@ingestion-rabbitmq:5672/
      - RABBITMQ_QUEUE=video.processing
      - S3_ENDPOINT_URL=http://ingestion-minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
      - S3_BUCKET=videos
      - PART_SIZE_BYTES=8388608
    depends_on:
      - rabbitmq
      - minio
    
  minio:
    image: minio/minio:latest
    container_name: ingestion-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ingestion-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmqadmin
      RABBITMQ_DEFAULT_PASS: rabbitmqadmin

volumes:
  minio_data:
